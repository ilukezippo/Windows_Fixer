name: Build & Release Windows Fixer

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
    paths-ignore: [ "*.md", "assets/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $args = @("--onefile", "--noconsole", "--name", "windows_fixer")

          # Icon + bundled assets
          if (Test-Path "icon.ico") {
            $args += @("--icon", "icon.ico")
            $args += @("--add-data", "icon.ico;.")
          }
          if (Test-Path "kuwait.png") {
            $args += @("--add-data", "kuwait.png;.")
          }

          # Bundle wav into EXE as fallback
          if (Test-Path "success.wav") {
            $args += @("--add-data", "success.wav;.")
          } elseif (Test-Path "Success.wav") {
            $args += @("--add-data", "Success.wav;.")
          }

          pyinstaller @args windows_fixer.py

          New-Item -ItemType Directory -Force -Path release_out | Out-Null

          # Name the exe nicely for release
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            Copy-Item "dist\windows_fixer.exe" "release_out\WindowsFixer_${{ github.ref_name }}.exe" -Force
          } else {
            Copy-Item "dist\windows_fixer.exe" "release_out\WindowsFixer_dev.exe" -Force
          }

          # ✅ Option A: Put success.wav next to the EXE (portable)
          if (Test-Path "success.wav") {
            Copy-Item "success.wav" "release_out\success.wav" -Force
          } elseif (Test-Path "Success.wav") {
            Copy-Item "Success.wav" "release_out\success.wav" -Force
          }

      - name: Create SHA256
        shell: pwsh
        run: |
          if (Test-Path "release_out\SHA256SUMS.txt") { Remove-Item "release_out\SHA256SUMS.txt" -Force }

          $files = Get-ChildItem "release_out" -File
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Out-File "release_out\SHA256SUMS.txt" -Append -Encoding ascii
          }

      - name: Zip bundle
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $zip = "WindowsFixer_${{ github.ref_name }}_Windows_x64.zip"
          } else {
            $zip = "WindowsFixer_dev_Windows_x64.zip"
          }

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "release_out\*" -DestinationPath $zip -Force

          echo "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows_Fixer_Build
          path: ${{ env.ZIP_NAME }}

      - name: Release notes (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          {
            echo "**Repair and clean up Windows, in one window.** DISM, SFC, CHKDSK, network reset and safe cleanup tools, in English and Arabic."
            echo
            echo "**Download:** \`WindowsFixer_${TAG}_Windows_x64.zip\` below, unzip it anywhere and run \`WindowsFixer_${TAG}.exe\`. Nothing to install."
            echo "The app is not code-signed yet, so Windows may warn: if Edge holds the download, choose *… → Keep → Show more → Keep anyway*; if SmartScreen warns when you run it, choose *More info → Run anyway*."
            echo
            echo "Requires Windows 10 or 11."
            echo
            echo "## What's new in $V"
            awk -v head="## $V" 'index($0, head) == 1 {on = 1; next} /^## / {if (on) exit} on' CHANGELOG.md | sed 's/^### /#### /'
          } > release_notes.md
          cat release_notes.md

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          make_latest: true
          body_path: release_notes.md

      - name: Point the Download buttons at this release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git checkout -B main origin/main
          sed -i -E -e "s#releases/download/v[0-9][^/\"]*/WindowsFixer_v[0-9][^/\")]*_Windows_x64\.zip#releases/download/$TAG/WindowsFixer_${TAG}_Windows_x64.zip#g" \
                    -e "s#Download WindowsFixer_v[0-9][0-9.]*_Windows_x64\.zip#Download WindowsFixer_${TAG}_Windows_x64.zip#g" \
                    -e "s#run \*\*WindowsFixer_v[0-9][0-9.]*\.exe\*\*#run **WindowsFixer_${TAG}.exe**#g" README.md
          if git diff --quiet; then echo "buttons already point at $TAG"; exit 0; fi
          git commit -am "Download buttons: Windows Fixer $TAG"
          git push origin main
