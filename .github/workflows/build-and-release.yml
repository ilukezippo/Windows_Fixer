name: Build & Release Windows Fixer

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
    paths-ignore: [ "*.md", "assets/**", "shots/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build a single EXE
        shell: pwsh
        run: |
          # Everything (icon, flag, sound, theme) goes inside the one EXE
          $wav = if (Test-Path "success.wav") { "success.wav" } else { "Success.wav" }
          pyinstaller --noconfirm --onefile --noconsole --name windows_fixer `
            --icon icon.ico --collect-data sv_ttk `
            --add-data "icon.ico;." --add-data "kuwait.png;." --add-data "$wav;success.wav" `
            windows_fixer.py

          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $exe = "WindowsFixer_${{ github.ref_name }}.exe"
          } else {
            $exe = "WindowsFixer_dev.exe"
          }
          Copy-Item "dist\windows_fixer.exe" $exe -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          echo "EXE_NAME=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          echo "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows_Fixer_Build
          path: ${{ env.EXE_NAME }}

      - name: Release notes (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          {
            echo "**Repair and clean up Windows, in one window.** DISM, SFC, CHKDSK, network reset and safe cleanup tools, with a problem finder. Light and dark themes, English and Arabic."
            echo
            echo "**Download:** \`WindowsFixer_${TAG}.exe\` below and run it. One file, nothing to install."
            echo "The app is not code-signed yet, so Windows may warn: if Edge holds the download, choose *… → Keep → Show more → Keep anyway*; if SmartScreen warns when you run it, choose *More info → Run anyway*."
            echo
            echo "Requires Windows 10 or 11. SHA-256: \`${EXE_SHA256}\`"
            echo
            echo "## What's new in $V"
            awk -v head="## $V" 'index(0 KWD, head) == 1 {on = 1; next} /^## / {if (on) exit} on' CHANGELOG.md | sed 's/^### /#### /'
          } > release_notes.md
          cat release_notes.md

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_NAME }}
          make_latest: true
          body_path: release_notes.md

      - name: Point the Download buttons at this release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git checkout -B main origin/main
          sed -i -E -e "s#releases/download/v[0-9][^/\"]*/WindowsFixer_v[0-9][^/\")]*\.exe#releases/download/$TAG/WindowsFixer_${TAG}.exe#g" \
                    -e "s#Download WindowsFixer_v[0-9][0-9.]*\.exe#Download WindowsFixer_${TAG}.exe#g" README.md
          if git diff --quiet; then echo "buttons already point at $TAG"; exit 0; fi
          git commit -am "Download buttons: Windows Fixer $TAG"
          git push origin main
